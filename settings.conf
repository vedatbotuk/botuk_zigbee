FIRMWARE_VERSION=ver0.108
# This is needed for OTA updates.
VERSION=13

# Dummy changes

# This perform only for dev devices
# For prod devices use prod_devices.csv
## Feature flags are concatenated left-to-right to generate MODEL_ID.
END_DEVICE=0
OTA_UPGRADE=1
DHT22=0
BME680=0
BATTERY=0
LIGHT_SLEEP=0
DEEP_SLEEP=0
SENSOR_WATERLEAK=0
BUILTIN_LIGHT=1
SWITCH=0
IRRIGATION=0
SOME_FEATURE=0
FEATURE_12=0
FEATURE_13=0
FEATURE_14=0
FEATURE_16=0

DEVICE_ENDPOINT=10

# Only for end devices Value is in milliseconds
ED_KEEP_ALIVE=4000

# Value is in minutes
# If battery device -> device sleep under <5% battery,
# the device will sleep 6 times longer than the given value.
DEEP_SLEEP_TIME=30

# If test device use SIMULATE_ZIGBEE_CHANNEL, otherwise 25 is the default
ZIGBEE_CHANNEL=25

#### Do not change ####
#### ############# ####
MANUFACTURER=4097

# 126=esp32-h2-devkitc-1 with gpio light driver
# 127=esp32-h2-devkitc-1,
# 127 <= esp32-h2-devkitc-1,
# 128 >= esp32-h2-zero,
# 128=esp32-h2-zero,
HW_VERSION=127

# This will be included in the filename. If you create production firmware, use the prod script.
DEV_PROD=dev

#### TESTING ####
# This is for testing purposes only. Do not change.
TESTING=0
SIMULATE=0
SIMULATE_ZIGBEE_CHANNEL=11
