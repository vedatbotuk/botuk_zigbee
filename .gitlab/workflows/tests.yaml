run_host_tests:
  stage: validate
  image: alpine:3.20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  script:
    - apk add --no-cache build-base cmake
    - cmake -S tests -B tests/build
    - cmake --build tests/build --parallel
    - ctest --test-dir tests/build --output-on-failure